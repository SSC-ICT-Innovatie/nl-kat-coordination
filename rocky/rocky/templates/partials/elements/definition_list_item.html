{% if show_empty_description or description %}
    <div>
        <dt>
            <span class="uc-first">{{ label }}:</span>
        </dt>
        <dd>
            {% if description %}
                {% if preserve_linebreaks %}
                    {{ description|linebreaksbr }}
                {% else %}
                    {{ description }}
                {% endif %}
            {% else %}
                -
            {% endif %}
        </dd>
    </div>
{% endif %}
